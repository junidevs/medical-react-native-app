name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: medconnect
          POSTGRES_USER: medconnect
          POSTGRES_PASSWORD: medconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medconnect -d medconnect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate
        run: pnpm --filter @medconnect/api prisma:migrate
        env:
          DATABASE_URL: postgresql://medconnect:medconnect@localhost:5432/medconnect?schema=public
          DIRECT_DATABASE_URL: postgresql://medconnect:medconnect@localhost:5432/medconnect?schema=public

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

